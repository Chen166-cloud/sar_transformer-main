services:
  sar:
    build:
      context: .
      dockerfile: Dockerfile
    image: sar-denoise:cuda12.1
    working_dir: /workspace
    volumes:
      - .:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: "8gb"
    stdin_open: true
    tty: true
